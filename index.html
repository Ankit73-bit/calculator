<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="display">
        <span>1234</span>
      </div>
      <div class="wrapper">
        <div class="num-pad">
          <button type="button" class="btn num-btn">9</button>
          <button type="button" class="btn num-btn">8</button>
          <button type="button" class="btn num-btn">7</button>
          <button type="button" class="btn num-btn">6</button>
          <button type="button" class="btn num-btn">5</button>
          <button type="button" class="btn num-btn">4</button>
          <button type="button" class="btn num-btn">3</button>
          <button type="button" class="btn num-btn">2</button>
          <button type="button" class="btn num-btn">1</button>
          <button type="button" class="btn num-btn">0</button>
          <button type="button" class="btn num-btn">00</button>
          <button type="button" class="btn num-btn">.</button>
        </div>
        <div class="action-btns">
          <button type="button" class="btn btn-switch">A/C</button>
          <button type="button" class="btn btn-clear">C</button>
          <button type="button" class="btn btn-add">+</button>
          <button type="button" class="btn btn-substract">-</button>
          <button type="button" class="btn btn-multiply">*</button>
          <button type="button" class="btn btn-divide">/</button>
          <button type="button" class="btn btn-equal">=</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
